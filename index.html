<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NY Lottery Analytics Dashboard (Current Year)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 font-sans text-xs">
  <div class="max-w-7xl mx-auto space-y-4">
    
    <!-- Compact Header with Game Tabs -->
    <header class="flex flex-wrap justify-between items-center border-b border-slate-800 pb-3 gap-3">
      <div>
        <div class="flex items-center gap-2">
          <h1 id="game-title" class="text-xl font-extrabold text-amber-400">Millionaire for Life</h1>
          <a 
            id="official-link"
            href="https://nylottery.ny.gov/draw-game/?game=million4life" 
            target="_blank" 
            rel="noopener noreferrer" 
            class="inline-flex items-center gap-1 text-[11px] font-semibold text-slate-400 hover:text-amber-400 bg-slate-800 hover:bg-slate-700 border border-slate-700 px-2 py-0.5 rounded transition-colors"
            title="Open Official NY Lottery Page"
          >
            <span>Official Game Page</span>
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
            </svg>
          </a>
        </div>
        <p class="text-slate-400 text-xs mt-0.5">SODA API Analysis (Current Year 2026 Only)</p>
      </div>

      <!-- Game Selection Tabs -->
      <div class="flex bg-slate-800 p-1 rounded-lg border border-slate-700/80 gap-1">
        <button 
          id="tab-m4l" 
          onclick="switchGame('m4l')" 
          class="px-3 py-1.5 rounded-md font-bold transition-all bg-amber-400 text-slate-900 shadow"
        >
          Millionaire for Life
        </button>
        <button 
          id="tab-pb" 
          onclick="switchGame('pb')" 
          class="px-3 py-1.5 rounded-md font-bold transition-all text-slate-400 hover:text-slate-100"
        >
          Powerball
        </button>
        <button 
          id="tab-mm" 
          onclick="switchGame('mm')" 
          class="px-3 py-1.5 rounded-md font-bold transition-all text-slate-400 hover:text-slate-100"
        >
          Mega Millions
        </button>
      </div>

      <div id="status" class="text-xs text-amber-200/60 font-mono w-full sm:w-auto text-right">Loading records...</div>
    </header>

    <!-- 3-Column Uniform Grid Layout -->
    <main class="grid grid-cols-1 lg:grid-cols-12 gap-4 items-start">
      
      <!-- COLUMN 1: Past Winning Numbers (Lg: 4 cols) -->
      <section class="lg:col-span-4 bg-slate-800/50 rounded-xl p-4 border border-slate-700/50 shadow-lg space-y-3">
        <div class="flex justify-between items-center border-b border-slate-700/50 pb-2">
          <h2 class="text-sm font-bold text-slate-200 flex items-center gap-1.5">
            <span>📅</span> Winning Numbers
          </h2>
          <button id="toggle-draws-btn" onclick="toggleDraws()" class="text-amber-400 hover:underline font-semibold text-[11px]">
            Show All (2026)
          </button>
        </div>
        <div id="recent-draws" class="space-y-2">
          <!-- Dynamic Content -->
        </div>
      </section>

      <!-- COLUMN 2: 🔥 Hot Picks & ❄️ Cold Picks (Lg: 5 cols) -->
      <section class="lg:col-span-5 grid grid-cols-2 gap-3">
        
        <!-- 🔥 Hot Picks Panel -->
        <div class="bg-slate-800/50 rounded-xl p-4 border border-slate-700/50 shadow-lg space-y-3">
          <div class="flex justify-between items-center border-b border-slate-700/50 pb-2">
            <h2 class="text-sm font-bold text-amber-400 flex items-center gap-1">
              <span>🔥</span> Hot Picks
            </h2>
          </div>
          <div id="hot-picks" class="space-y-2">
            <!-- Dynamic Content -->
          </div>
        </div>

        <!-- ❄️ Cold Picks Panel -->
        <div class="bg-slate-800/50 rounded-xl p-4 border border-slate-700/50 shadow-lg space-y-3">
          <div class="flex justify-between items-center border-b border-slate-700/50 pb-2">
            <h2 class="text-sm font-bold text-cyan-400 flex items-center gap-1">
              <span>❄️</span> Cold Picks
            </h2>
            <button id="toggle-picks-btn" onclick="togglePicks()" class="text-amber-400 hover:underline font-semibold text-[11px]">
              Expand to 10
            </button>
          </div>
          <div id="cold-picks" class="space-y-2">
            <!-- Dynamic Content -->
          </div>
        </div>

      </section>

      <!-- COLUMN 3: Bonus Ball Frequencies (Lg: 3 cols) -->
      <section class="lg:col-span-3 bg-slate-800/50 rounded-xl p-4 border border-slate-700/50 shadow-lg space-y-3">
        <div class="flex justify-between items-center border-b border-slate-700/50 pb-2">
          <h2 id="bonus-title" class="text-sm font-bold text-slate-200 flex items-center gap-1.5">
            <span>🟡</span> Mill Ball Frequencies
          </h2>
        </div>
        <div id="bonus-balls" class="space-y-2">
          <!-- Dynamic Content -->
        </div>
      </section>

    </main>

  </div>

  <script>
    const APP_TOKEN = "OPDPTaiPiF7aR1xR1PHvuA4O9";
    const CURRENT_YEAR = new Date().getFullYear().toString(); // "2026"

    const GAME_CONFIGS = {
      m4l: {
        title: "Millionaire for Life",
        bonusTitle: "🟡 Mill Ball Frequencies",
        link: "https://nylottery.ny.gov/draw-game/?game=million4life",
        url: `https://data.ny.gov/resource/a4w9-a3tp.json?$limit=5000&$where=draw_date >= '${CURRENT_YEAR}-01-01T00:00:00.000'&$order=draw_date DESC`,
        maxWhite: 58,
        maxBonus: 5,
        bonusKeys: ["mill_ball"],
        bonusColor: "bg-amber-400 text-slate-900 border-amber-300"
      },
      pb: {
        title: "Powerball",
        bonusTitle: "🔴 Powerball Frequencies",
        link: "https://nylottery.ny.gov/draw-game/?game=powerball",
        url: `https://data.ny.gov/resource/d6yy-54nr.json?$limit=5000&$where=draw_date >= '${CURRENT_YEAR}-01-01T00:00:00.000'&$order=draw_date DESC`,
        maxWhite: 69,
        maxBonus: 26,
        bonusKeys: ["powerball", "red_ball"],
        bonusColor: "bg-red-600 text-white border-red-400 font-bold"
      },
      mm: {
        title: "Mega Millions",
        bonusTitle: "🟡 Mega Ball Frequencies",
        link: "https://nylottery.ny.gov/draw-game/?game=megamillions",
        url: `https://data.ny.gov/resource/5xaw-6ayf.json?$limit=5000&$where=draw_date >= '${CURRENT_YEAR}-01-01T00:00:00.000'&$order=draw_date DESC`,
        maxWhite: 70,
        maxBonus: 25,
        bonusKeys: ["mega_ball"],
        bonusColor: "bg-amber-400 text-slate-900 border-amber-300"
      }
    };

    let currentGame = "m4l";
    let globalDraws = [];
    let globalWhiteFreq = {};
    let globalTotalDraws = 0;
    
    let showAllDraws = false;
    let showTop10Picks = false;

    async function switchGame(gameKey) {
      if (currentGame === gameKey) return;
      currentGame = gameKey;

      ["m4l", "pb", "mm"].forEach(k => {
        const tab = document.getElementById(`tab-${k}`);
        if (k === gameKey) {
          tab.className = "px-3 py-1.5 rounded-md font-bold transition-all bg-amber-400 text-slate-900 shadow";
        } else {
          tab.className = "px-3 py-1.5 rounded-md font-bold transition-all text-slate-400 hover:text-slate-100";
        }
      });

      const config = GAME_CONFIGS[gameKey];
      document.getElementById("game-title").innerText = config.title;
      document.getElementById("bonus-title").innerText = config.bonusTitle;
      document.getElementById("official-link").href = config.link;

      await fetchAndAnalyze();
    }

    // Helper to parse numbers and bonus ball consistently across varying API formats
    function parseDrawRecord(draw, config) {
      let white = [];
      let bonus = null;

      // Check explicit bonus keys in JSON object first
      for (const key of config.bonusKeys) {
        if (draw[key] !== undefined && draw[key] !== null) {
          bonus = parseInt(draw[key], 10);
          break;
        }
      }

      if (draw.winning_numbers) {
        const parts = draw.winning_numbers.trim().split(/\s+/).map(n => parseInt(n, 10)).filter(n => !isNaN(n));
        
        if (bonus !== null && !isNaN(bonus)) {
          // Bonus was found in its own field, remaining winning numbers are white balls
          white = parts;
        } else if (parts.length > 0) {
          // Bonus was attached as the last number in winning_numbers string
          bonus = parts.pop();
          white = parts;
        }
      }

      return { white, bonus };
    }

    async function fetchAndAnalyze() {
      const statusEl = document.getElementById("status");
      statusEl.innerText = "Loading 2026 data...";
      
      const config = GAME_CONFIGS[currentGame];

      try {
        const response = await fetch(config.url, {
          headers: { "X-App-Token": APP_TOKEN }
        });

        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        
        globalDraws = await response.json();
        globalTotalDraws = globalDraws.length;

        if (globalTotalDraws === 0) {
          statusEl.innerText = "No 2026 draw history found.";
          return;
        }

        statusEl.innerText = `${globalTotalDraws} draws loaded for 2026.`;

        // Initialize frequency maps
        globalWhiteFreq = {};
        for (let i = 1; i <= config.maxWhite; i++) {
          globalWhiteFreq[i] = 0;
        }

        const bonusFreq = {};
        for (let i = 1; i <= config.maxBonus; i++) {
          bonusFreq[i] = 0;
        }

        globalDraws.forEach(draw => {
          const { white, bonus } = parseDrawRecord(draw, config);

          white.forEach(num => {
            if (globalWhiteFreq.hasOwnProperty(num)) {
              globalWhiteFreq[num]++;
            }
          });

          if (bonus !== null && bonusFreq.hasOwnProperty(bonus)) {
            bonusFreq[bonus]++;
          }
        });

        renderRecentDraws();
        renderPicks();
        renderBonusBalls(bonusFreq);

      } catch (err) {
        console.error("Fetch error:", err);
        statusEl.innerText = "Error loading 2026 data.";
      }
    }

    function renderRecentDraws() {
      const container = document.getElementById("recent-draws");
      container.innerHTML = "";

      const config = GAME_CONFIGS[currentGame];
      const limit = showAllDraws ? globalDraws.length : 7;
      const drawsToRender = globalDraws.slice(0, limit);

      drawsToRender.forEach(draw => {
        const dateStr = new Date(draw.draw_date).toLocaleDateString("en-US", {
          weekday: 'short',
          month: 'numeric',
          day: 'numeric',
          timeZone: 'UTC'
        });

        const { white, bonus } = parseDrawRecord(draw, config);
        
        const card = document.createElement("div");
        card.className = "bg-slate-900 border border-slate-700/80 p-2 rounded-lg flex items-center justify-between";
        
        let ballsHTML = white.map(num => `
          <span class="w-6 h-6 rounded-full bg-slate-100 text-slate-900 font-extrabold flex items-center justify-center text-xs shadow">
            ${String(num).padStart(2, '0')}
          </span>
        `).join("");

        if (bonus !== null && !isNaN(bonus)) {
          ballsHTML += `
            <span class="w-6 h-6 rounded-full ${config.bonusColor} font-black flex items-center justify-center text-xs shadow border">
              ${String(bonus).padStart(2, '0')}
            </span>
          `;
        }

        card.innerHTML = `
          <div class="text-[11px] font-semibold text-slate-300">${dateStr}</div>
          <div class="flex items-center gap-1">${ballsHTML}</div>
        `;

        container.appendChild(card);
      });
    }

    function renderPicks() {
      const hotContainer = document.getElementById("hot-picks");
      const coldContainer = document.getElementById("cold-picks");
      
      hotContainer.innerHTML = "";
      coldContainer.innerHTML = "";

      const countToDisplay = showTop10Picks ? 10 : 7;

      const allNumbers = Object.keys(globalWhiteFreq).map(num => ({
        num: parseInt(num, 10),
        count: globalWhiteFreq[num],
        pct: globalTotalDraws > 0 ? ((globalWhiteFreq[num] / globalTotalDraws) * 100).toFixed(1) : "0.0"
      }));

      const hotList = [...allNumbers]
        .sort((a, b) => b.count - a.count || a.num - b.num)
        .slice(0, countToDisplay);

      const coldList = [...allNumbers]
        .sort((a, b) => a.count - b.count || a.num - b.num)
        .slice(0, countToDisplay);

      hotList.forEach((item, idx) => {
        const card = document.createElement("div");
        card.className = "bg-slate-900 border border-slate-700/80 p-2 rounded-md flex items-center justify-between";
        card.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="text-[10px] font-bold text-slate-500">#${idx + 1}</span>
            <span class="w-6 h-6 rounded-full bg-amber-400 text-slate-900 font-black flex items-center justify-center text-xs shadow">
              ${String(item.num).padStart(2, '0')}
            </span>
          </div>
          <div class="text-right">
            <div class="text-xs font-bold text-amber-400">${item.pct}%</div>
            <div class="text-[10px] text-slate-400">${item.count} hits</div>
          </div>
        `;
        hotContainer.appendChild(card);
      });

      coldList.forEach((item, idx) => {
        const card = document.createElement("div");
        card.className = "bg-slate-900 border border-slate-700/80 p-2 rounded-md flex items-center justify-between";
        card.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="text-[10px] font-bold text-slate-500">#${idx + 1}</span>
            <span class="w-6 h-6 rounded-full bg-cyan-500 text-slate-900 font-black flex items-center justify-center text-xs shadow">
              ${String(item.num).padStart(2, '0')}
            </span>
          </div>
          <div class="text-right">
            <div class="text-xs font-bold text-cyan-400">${item.pct}%</div>
            <div class="text-[10px] text-slate-400">${item.count} hits</div>
          </div>
        `;
        coldContainer.appendChild(card);
      });
    }

    function renderBonusBalls(freqMap) {
      const container = document.getElementById("bonus-balls");
      container.innerHTML = "";

      const config = GAME_CONFIGS[currentGame];

      const sorted = Object.keys(freqMap)
        .map(num => ({
          num: parseInt(num, 10),
          count: freqMap[num],
          pct: globalTotalDraws > 0 ? parseFloat(((freqMap[num] / globalTotalDraws) * 100).toFixed(1)) : 0
        }))
        .sort((a, b) => b.count - a.count || a.num - b.num);

      sorted.forEach(item => {
        const row = document.createElement("div");
        row.className = "space-y-1 bg-slate-900 p-2 rounded-lg border border-slate-700/80";
        row.innerHTML = `
          <div class="flex justify-between text-xs">
            <span class="font-bold text-amber-300">Ball [${String(item.num).padStart(2, '0')}]</span>
            <span class="text-slate-400">${item.count} hits (${item.pct}%)</span>
          </div>
          <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden border border-slate-700">
            <div class="${config.bonusColor.split(' ')[0]} h-2 rounded-full transition-all duration-500" style="width: ${Math.min(item.pct * 3, 100)}%"></div>
          </div>
        `;
        container.appendChild(row);
      });
    }

    function toggleDraws() {
      showAllDraws = !showAllDraws;
      document.getElementById("toggle-draws-btn").innerText = showAllDraws ? "Show Past 7" : "Show All (2026)";
      renderRecentDraws();
    }

    function togglePicks() {
      showTop10Picks = !showTop10Picks;
      document.getElementById("toggle-picks-btn").innerText = showTop10Picks ? "Collapse to 7" : "Expand to 10";
      renderPicks();
    }

    fetchAndAnalyze();
  </script>
</body>
</html>
