<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Millionaire for Life - Stats Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-5xl mx-auto space-y-8">
    
    <!-- Header -->
    <header class="text-center space-y-2 border-b border-slate-800 pb-6">
      <h1 class="text-3xl font-extrabold text-amber-400">Millionaire for Life Analytics</h1>
      <p class="text-slate-400 text-sm">Real-time SODA API analysis from data.ny.gov</p>
      <div id="status" class="text-xs text-amber-200/60 font-mono">Loading draw records...</div>
    </header>

    <!-- Past Week Winning Numbers -->
    <section class="bg-slate-800/50 rounded-xl p-6 border border-slate-700/50 shadow-lg">
      <h2 class="text-lg font-semibold text-slate-200 mb-4 flex items-center gap-2">
        <span>📅</span> Past Week Winning Numbers (Last 7 Draws)
      </h2>
      <div id="recent-draws" class="space-y-3">
        <!-- Dynamic Content -->
      </div>
    </section>

    <!-- 10 Least Picked White Balls -->
    <section class="bg-slate-800/50 rounded-xl p-6 border border-slate-700/50 shadow-lg">
      <h2 class="text-lg font-semibold text-slate-200 mb-4 flex items-center gap-2">
        <span>🧊</span> 10 Coldest / Least Picked White Balls
      </h2>
      <div id="top-balls" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-4">
        <!-- Dynamic Content -->
      </div>
    </section>

    <!-- Mill Ball Breakdown -->
    <section class="bg-slate-800/50 rounded-xl p-6 border border-slate-700/50 shadow-lg">
      <h2 class="text-lg font-semibold text-slate-200 mb-4 flex items-center gap-2">
        <span>🟡</span> Millionaire Ball Frequencies
      </h2>
      <div id="mill-balls" class="space-y-4">
        <!-- Dynamic Content -->
      </div>
    </section>

  </div>

  <script>
    const APP_TOKEN = "OPDPTaiPiF7aR1xR1PHvuA4O9";
    const API_URL = `https://data.ny.gov/resource/a4w9-a3tp.json?$limit=5000&$order=draw_date%20DESC`;

    async function fetchAndAnalyze() {
      const statusEl = document.getElementById("status");
      try {
        const response = await fetch(API_URL, {
          headers: { "X-App-Token": APP_TOKEN }
        });

        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        
        const draws = await response.json();
        const totalDraws = draws.length;

        if (totalDraws === 0) {
          statusEl.innerText = "No draw history found.";
          return;
        }

        statusEl.innerText = `Analyzed ${totalDraws} drawings. Updated: ${new Date().toLocaleTimeString()}`;

        // 1. Render recent draws (past 7)
        renderRecentDraws(draws.slice(0, 7));

        // 2. Initialize all possible white balls (1 to 58) at 0 hits
        const whiteFreq = {};
        for (let i = 1; i <= 58; i++) {
          whiteFreq[i] = 0;
        }

        const millFreq = {};

        draws.forEach(draw => {
          if (draw.winning_numbers) {
            draw.winning_numbers.trim().split(/\s+/).forEach(numStr => {
              const num = parseInt(numStr, 10);
              if (!isNaN(num) && whiteFreq.hasOwnProperty(num)) {
                whiteFreq[num]++;
              }
            });
          }

          if (draw.mill_ball) {
            const mb = parseInt(draw.mill_ball, 10);
            if (!isNaN(mb)) millFreq[mb] = (millFreq[mb] || 0) + 1;
          }
        });

        renderLeastWhiteBalls(whiteFreq, totalDraws);
        renderMillBalls(millFreq, totalDraws);

      } catch (err) {
        console.error("Fetch error:", err);
        statusEl.innerText = "Error loading data from data.ny.gov API.";
      }
    }

    function renderRecentDraws(recentDraws) {
      const container = document.getElementById("recent-draws");
      container.innerHTML = "";

      recentDraws.forEach(draw => {
        const dateStr = new Date(draw.draw_date).toLocaleDateString("en-US", {
          weekday: 'short',
          month: 'short',
          day: 'numeric',
          year: 'numeric',
          timeZone: 'UTC'
        });

        const whiteBalls = draw.winning_numbers.trim().split(/\s+/);
        
        const card = document.createElement("div");
        card.className = "bg-slate-900 border border-slate-700 p-3 rounded-lg flex flex-wrap items-center justify-between gap-4";
        
        let ballsHTML = whiteBalls.map(num => `
          <span class="w-8 h-8 rounded-full bg-slate-100 text-slate-900 font-bold flex items-center justify-center text-sm shadow">
            ${num}
          </span>
        `).join("");

        ballsHTML += `
          <span class="w-8 h-8 rounded-full bg-amber-400 text-slate-900 font-black flex items-center justify-center text-sm shadow border-2 border-amber-300">
            ${draw.mill_ball}
          </span>
        `;

        card.innerHTML = `
          <div class="text-sm font-semibold text-slate-300 w-36">${dateStr}</div>
          <div class="flex items-center gap-2">${ballsHTML}</div>
        `;

        container.appendChild(card);
      });
    }

    function renderLeastWhiteBalls(freqMap, totalDraws) {
      const container = document.getElementById("top-balls");
      container.innerHTML = "";

      const sorted = Object.keys(freqMap)
        .map(num => ({
          num: parseInt(num, 10),
          count: freqMap[num],
          pct: ((freqMap[num] / totalDraws) * 100).toFixed(1)
        }))
        .sort((a, b) => a.count - b.count || a.num - b.num)
        .slice(0, 10);

      sorted.forEach((item, idx) => {
        const card = document.createElement("div");
        card.className = "bg-slate-900 border border-slate-700 p-4 rounded-lg flex items-center justify-between";
        card.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="text-xs font-bold text-cyan-500">#${idx + 1}</span>
            <span class="w-10 h-10 rounded-full bg-slate-800 text-slate-100 border border-slate-600 font-extrabold flex items-center justify-center text-lg shadow">
              ${String(item.num).padStart(2, '0')}
            </span>
          </div>
          <div class="text-right">
            <div class="text-sm font-bold text-cyan-400">${item.pct}%</div>
            <div class="text-xs text-slate-400">${item.count} hits</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderMillBalls(freqMap, totalDraws) {
      const container = document.getElementById("mill-balls");
      container.innerHTML = "";

      const sorted = Object.keys(freqMap)
        .map(num => ({
          num: parseInt(num, 10),
          count: freqMap[num],
          pct: parseFloat(((freqMap[num] / totalDraws) * 100).toFixed(1))
        }))
        .sort((a, b) => b.count - a.count || a.num - b.num);

      sorted.forEach(item => {
        const row = document.createElement("div");
        row.className = "space-y-1";
        row.innerHTML = `
          <div class="flex justify-between text-sm">
            <span class="font-bold text-amber-300">Ball [${item.num}]</span>
            <span class="text-slate-400">${item.count} hits (${item.pct}%)</span>
          </div>
          <div class="w-full bg-slate-900 rounded-full h-3 overflow-hidden border border-slate-700">
            <div class="bg-amber-400 h-3 rounded-full transition-all duration-500" style="width: ${item.pct * 3}%"></div>
          </div>
        `;
        container.appendChild(row);
      });
    }

    fetchAndAnalyze();
  </script>
</body>
</html>
